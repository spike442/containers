name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Version
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: previous
        name: Find the last release
        run: |
          last="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true)"
          echo "tag=$last" >> "$GITHUB_OUTPUT"
          if [[ -n "$last" ]]; then
            echo "commits=$(git rev-list --count "$last..HEAD")" >> "$GITHUB_OUTPUT"
          fi
      - id: semver
        if: steps.previous.outputs.tag != ''
        uses: paulhatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: v
          version_format: ${major}.${minor}.${patch}
      - id: version
        name: Select the version
        env:
          LAST: ${{ steps.previous.outputs.tag }}
          COMMITS: ${{ steps.previous.outputs.commits }}
          NEXT: ${{ steps.semver.outputs.version }}
        run: |
          if [[ -z "$LAST" ]]; then
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          elif [[ "$COMMITS" != "0" ]]; then
            version="$NEXT"
          else
            version=""
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: ${version:-nothing to release since $LAST}"

  build:
    name: Publish
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

  release:
    name: Tag the release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.20"
          python-version: "3.12"
      - name: Record the released version
        run: |
          for project in $(git ls-files 'pyproject.toml' '*/pyproject.toml'); do
            uv version "$VERSION" --frozen --directory "$(dirname "$project")"
          done
          uv lock
      - id: commit
        name: Commit the released version
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore(release): v${{ env.VERSION }}"
          branch: ${{ github.ref_name }}
      - name: Tag the release
        env:
          COMMIT: ${{ steps.commit.outputs.commit_hash || github.sha }}
        run: |
          git tag "v$VERSION" "$COMMIT"
          git push origin "refs/tags/v$VERSION"
